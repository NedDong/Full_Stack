<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antra LIFE Layout</title>
    <style>
        table {
            width: 50%;
            font-family: Arial, sans-serif;
            table-layout: fixed;
            border: 1px solid black;
            height: 500px;
        }
        td {
            border: 1px solid black;
            padding: 5px;
            text-align: center;
            vertical-align: middle;
        }
        .nested-table td {
            border: 1px solid black;
            font-size: 1em;
            padding: 0px;
        }
        .title {
            font-size: 2em;
            font-weight: bold;
        }
        .footer {
            font-size: 2em;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td colspan="4" class="title">Antra LIFE</td>
        </tr>
        <tr>
            <td colspan="2" style="vertical-align: top; text-align: left;">Google</td>
            <td colspan="2">GitHub</td>
        </tr>
        <tr>
            <td>FB</td>
            <td>GMail</td>
            <td>YouTube</td>
            <td>2048</td>
        </tr>
        <tr>
            <td>Food</td>
            <td>Game</td>
            <td colspan="2">
                <table class="nested-table" style="width: 100%; height: 100%;">
                    <tr>
                        <td>Social Life</td>
                    </tr>
                    <tr>
                        <td>Sleep</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td colspan="3" style="text-align: right; font-weight: bold;">Beer></td>
            <td colspan="1">WC</td>
        </tr>
    </table>
</body>
</html>
